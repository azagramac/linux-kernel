name: 🐧 Build kernel

on:
  workflow_dispatch:
    inputs:
      target:
        description: '🎯 Select a device'
        required: true
        type: choice
        options:
          - 'AMD Ryzen 9'
          - 'Lenovo Thinkpad T440p'
          - 'Both'
        default: 'Both'
      config:
        description: '📄 Kernel configuration file'
        required: true
        type: choice
        options:
          - 'configs/stable/config-7.3-ryzen9-debian13-signed'
          - 'configs/stable/config-7.3-t440p-debian13-signed'
          - 'configs/stable/config-6.19.14-ryzen9-debian13-signed'
          - 'configs/stable/config-6.19.14-t440p-debian13-signed'
          - 'configs/stable/config-6.19.14-debian13'
          - 'configs/testing/config-7.2.9-debian13'
          - 'configs/testing/config-7.2.8-debian13'
          - 'custom'
        default: 'configs/stable/config-7.3-ryzen9-debian13-signed'
      custom_config:
        description: '⚙️ Custom config path (used if config is "custom")'
        required: false
        default: ''
      url:
        description: '📦 Kernel tarball URL (optional override; default: auto-downloaded from kernel.org)'
        required: false
        default: ''
      tag:
        description: '🏷️ Git tag from torvalds/linux repo (optional override, used if no URL and specified)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_OPTIONS: "--no-deprecation"
  DEFAULT_URL: 'https://www.kernel.org/pub/linux/kernel/v7.x/linux-7.3.tar.gz'
  RAW_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/"
  KERNEL_TARGET: ${{ inputs.target }}
  KERNEL_CONFIG: ${{ inputs.config }}
  KERNEL_URL: ${{ inputs.url }}
  KERNEL_TAG: ${{ inputs.tag }}

jobs:
  prepare:
    name: 🔍 1. Prepare Environment & Source
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    outputs:
      kernel_tag: ${{ steps.kernel_source.outputs.kernel_tag }}
      targets_matrix: ${{ steps.matrix_config.outputs.targets_matrix }}
      target_choice: ${{ inputs.target }}
      config_choice: ${{ steps.matrix_config.outputs.config_choice }}
      download_url: ${{ steps.matrix_config.outputs.kernel_url }}

    steps:
      - name: 🛠️ Prepare container base tools
        run: |
          apt-get update -qq
          apt-get install -y git sudo curl tar xz-utils procps

      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: ⚙️ Install base build dependencies
        run: |
          sudo apt install -y git build-essential gcc-14 g++-14 bc bison flex curl jq patch
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: 🎯 Determine build targets matrix & source
        id: matrix_config
        shell: bash
        run: |
          TARGET="${{ inputs.target }}"
          SELECTED_CONFIG="${{ inputs.config }}"
          CUSTOM_CONFIG="${{ inputs.custom_config }}"
          INPUT_URL="${{ inputs.url }}"
          INPUT_TAG="${{ inputs.tag }}"

          if [ "$SELECTED_CONFIG" = "custom" ] && [ -n "$CUSTOM_CONFIG" ]; then
            SELECTED_CONFIG="$CUSTOM_CONFIG"
          fi

          # Extract version from config name (e.g. config-7.3-ryzen9-... -> 7.3)
          VERSION=$(basename "$SELECTED_CONFIG" | sed -nE 's/.*config-([0-9]+(\.[0-9]+)+).*/\1/p')

          # Fallback: check inside config file header if present
          if [ -z "$VERSION" ] && [ -f "$SELECTED_CONFIG" ]; then
            VERSION=$(grep -m1 -E '^[# ]*Linux/x86 [0-9]' "$SELECTED_CONFIG" | awk '{print $3}' | sed 's/\.0$//')
          elif [ -z "$VERSION" ] && [ -f "configs/$SELECTED_CONFIG" ]; then
            VERSION=$(grep -m1 -E '^[# ]*Linux/x86 [0-9]' "configs/$SELECTED_CONFIG" | awk '{print $3}' | sed 's/\.0$//')
          fi

          if [ -z "$VERSION" ]; then
            VERSION="7.3"
          fi

          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          # Determine Ryzen config path
          if echo "$SELECTED_CONFIG" | grep -qi "ryzen"; then
            RYZEN_CONFIG="$SELECTED_CONFIG"
          elif [ -f "configs/stable/config-${VERSION}-ryzen9-debian13-signed" ]; then
            RYZEN_CONFIG="configs/stable/config-${VERSION}-ryzen9-debian13-signed"
          elif [ -f "configs/stable/config-${VERSION}-debian13-signed" ]; then
            RYZEN_CONFIG="configs/stable/config-${VERSION}-debian13-signed"
          elif [ -f "configs/stable/config-${VERSION}-debian13" ]; then
            RYZEN_CONFIG="configs/stable/config-${VERSION}-debian13"
          elif [ -f "$SELECTED_CONFIG" ]; then
            RYZEN_CONFIG="$SELECTED_CONFIG"
          elif [ -f "configs/$SELECTED_CONFIG" ]; then
            RYZEN_CONFIG="configs/$SELECTED_CONFIG"
          elif [ -f "configs/stable/config-7.3-ryzen9-debian13-signed" ]; then
            RYZEN_CONFIG="configs/stable/config-7.3-ryzen9-debian13-signed"
          else
            RYZEN_CONFIG="$SELECTED_CONFIG"
          fi

          # Determine Lenovo Thinkpad T440p config path
          if echo "$SELECTED_CONFIG" | grep -qi "t440p"; then
            LENOVO_CONFIG="$SELECTED_CONFIG"
          elif [ -f "configs/stable/config-${VERSION}-t440p-debian13-signed" ]; then
            LENOVO_CONFIG="configs/stable/config-${VERSION}-t440p-debian13-signed"
          elif [ -f "configs/stable/config-${VERSION}-debian13-signed" ]; then
            LENOVO_CONFIG="configs/stable/config-${VERSION}-debian13-signed"
          elif [ -f "configs/stable/config-${VERSION}-debian13" ]; then
            LENOVO_CONFIG="configs/stable/config-${VERSION}-debian13"
          elif [ -f "$SELECTED_CONFIG" ]; then
            LENOVO_CONFIG="$SELECTED_CONFIG"
          elif [ -f "configs/$SELECTED_CONFIG" ]; then
            LENOVO_CONFIG="configs/$SELECTED_CONFIG"
          elif [ -f "configs/stable/config-7.3-t440p-debian13-signed" ]; then
            LENOVO_CONFIG="configs/stable/config-7.3-t440p-debian13-signed"
          else
            LENOVO_CONFIG="$SELECTED_CONFIG"
          fi

          # If target is specific device, prioritize selected config if compatible
          if [ "$TARGET" = "AMD Ryzen 9" ] && ! echo "$SELECTED_CONFIG" | grep -qi "t440p"; then
            RYZEN_CONFIG="$SELECTED_CONFIG"
          elif [ "$TARGET" = "Lenovo Thinkpad T440p" ] && ! echo "$SELECTED_CONFIG" | grep -qi "ryzen"; then
            LENOVO_CONFIG="$SELECTED_CONFIG"
          fi

          RYZEN_JSON="{\"id\":\"ryzen9\",\"name\":\"AMD Ryzen 9\",\"config_path\":\"$RYZEN_CONFIG\",\"kcflags\":\"-march=znver3 -O2 -pipe\",\"kcppflags\":\"-march=znver3 -mtune=znver3\",\"arch_flags\":\"-march=znver3 -O2 -pipe\",\"local_version\":\"-ryzen9\"}"
          LENOVO_JSON="{\"id\":\"t440p\",\"name\":\"Lenovo Thinkpad T440p\",\"config_path\":\"$LENOVO_CONFIG\",\"kcflags\":\"-march=haswell -mtune=haswell -O2 -pipe\",\"kcppflags\":\"-march=haswell -mtune=haswell\",\"arch_flags\":\"-march=haswell -mtune=haswell -O2 -pipe\",\"local_version\":\"-t440p\"}"

          case "$TARGET" in
            "AMD Ryzen 9")
              MATRIX="[$RYZEN_JSON]"
              ;;
            "Lenovo Thinkpad T440p")
              MATRIX="[$LENOVO_JSON]"
              ;;
            "Both")
              MATRIX="[$RYZEN_JSON,$LENOVO_JSON]"
              ;;
            *)
              echo "❌ Invalid target: $TARGET"
              exit 1
              ;;
          esac

          # Determine download source & URL
          if [ -n "$INPUT_URL" ]; then
            DOWNLOAD_URL="$INPUT_URL"
            DOWNLOAD_METHOD="url"
          elif [ -n "$INPUT_TAG" ]; then
            DOWNLOAD_METHOD="tag"
            GIT_TAG="$INPUT_TAG"
            DOWNLOAD_URL=""
          else
            DOWNLOAD_URL="https://www.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${VERSION}.tar.gz"
            DOWNLOAD_METHOD="url"
          fi

          echo "targets_matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "download_method=$DOWNLOAD_METHOD" >> "$GITHUB_OUTPUT"
          echo "kernel_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "git_tag=$GIT_TAG" >> "$GITHUB_OUTPUT"
          echo "config_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "config_choice=$SELECTED_CONFIG" >> "$GITHUB_OUTPUT"

          echo "========================================="
          echo "🎯 Target Option      : $TARGET"
          echo "📄 Config Selected    : $SELECTED_CONFIG"
          echo "🏷️ Kernel Version     : $VERSION (Major: $MAJOR)"
          echo "⬇️ Download Method    : $DOWNLOAD_METHOD"
          if [ "$DOWNLOAD_METHOD" = "url" ]; then
            echo "📦 Kernel URL         : $DOWNLOAD_URL"
          else
            echo "🏷️ Git Tag            : $GIT_TAG"
          fi
          echo "AMD Ryzen 9 config    : $RYZEN_CONFIG"
          echo "Lenovo T440p config   : $LENOVO_CONFIG"
          echo "📦 Targets Matrix     : $MATRIX"
          echo "========================================="

      - name: 📥 Download kernel tarball
        if: steps.matrix_config.outputs.download_method == 'url'
        id: download_tarball
        shell: bash
        run: |
          URL="${{ steps.matrix_config.outputs.kernel_url }}"
          echo "⬇️ Downloading kernel package from $URL..."

          FILENAME=$(basename "$URL")
          case "$FILENAME" in
            *.tar.gz)
              EXT="gz"
              ;;
            *.tar.xz)
              EXT="xz"
              ;;
            *)
              echo "❌ Only .tar.gz or .tar.xz URLs are allowed: $URL"
              exit 1
              ;;
          esac

          if ! curl -fL --retry 3 --retry-all-errors -o "kernel_package.tar.${EXT}" "$URL"; then
            if [ "$EXT" = "gz" ]; then
              FALLBACK_URL="${URL%.tar.gz}.tar.xz"
              echo "⚠️ .tar.gz failed, attempting fallback: $FALLBACK_URL"
              curl -fL --retry 3 --retry-all-errors -o "kernel_package.tar.xz" "$FALLBACK_URL"
              EXT="xz"
            else
              echo "❌ Failed to download kernel package from $URL"
              exit 1
            fi
          fi

          mkdir -p kernel_build
          tar -xf "kernel_package.tar.${EXT}" \
            -C kernel_build \
            --strip-components=1

      - name: 📥 Clone torvalds/linux repo
        if: steps.matrix_config.outputs.download_method == 'tag'
        id: clone_repo
        run: |
          git clone --depth 1 --branch "${{ steps.matrix_config.outputs.git_tag }}" \
            https://github.com/torvalds/linux \
            kernel_build

      - name: 🔍 Verify kernel source
        run: |
          if [ ! -f kernel_build/Makefile ]; then
            echo "❌ No valid kernel source available!"
            echo "Provide either a valid kernel tarball URL or a valid Linux kernel tag."
            exit 1
          fi
          echo "✅ Kernel source verified"

      - name: 🏷️ Determine kernel source version
        id: kernel_source
        working-directory: kernel_build
        run: |
          if [ -n "${{ steps.matrix_config.outputs.git_tag }}" ]; then
            TAG="${{ steps.matrix_config.outputs.git_tag }}"
          else
            TAG=$(make kernelversion)
          fi

          echo "kernel_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "🏷️ Kernel source version: $TAG"

      - name: 📤 Upload prepared clean kernel source artifact
        uses: actions/upload-artifact@v7
        with:
          name: prepared-kernel-source
          path: kernel_build/
          include-hidden-files: true

  build:
    name: 🐧 2. Build (${{ matrix.target.name }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets_matrix) }}
    container:
      image: debian:trixie
      options: -v /:/host

    steps:
      - name: 🛠️ Prepare container base tools
        run: |
          apt-get update -qq
          apt-get install -y git sudo curl tar xz-utils procps

      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🧹 Clean up host runner space & drop RAM caches
        run: |
          rm -rf /host/usr/share/dotnet \
                 /host/usr/local/lib/android \
                 /host/opt/ghc \
                 /host/opt/hostedtoolcache || true

      - name: ⚙️ Install build dependencies
        run: |
          sudo apt install -y git build-essential gcc-14 g++-14 fakeroot bc bison flex libdw-dev libelf-dev libssl-dev zstd \
            libncurses-dev dwarves debhelper rsync python3 ccache curl jq kmod lz4
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: 📥 Download prepared kernel source
        uses: actions/download-artifact@v8
        with:
          name: prepared-kernel-source
          path: kernel_build

      - name: 🔧 Restore execution permissions on kernel scripts
        run: |
          chmod -R +x kernel_build/scripts/
          find kernel_build -type f \( -name "*.sh" -o -name "*.pl" -o -name "*.py" \) -exec chmod +x {} +

      - name: 📄 Apply kernel config for target
        shell: bash
        run: |
          CONFIG_INPUT="${{ matrix.target.config_path }}"
          echo "Applying config: $CONFIG_INPUT for ${{ matrix.target.name }}"

          CONFIG_FILE=""
          if [ -f "$CONFIG_INPUT" ]; then
            CONFIG_FILE="$CONFIG_INPUT"
          elif [ -f "configs/$CONFIG_INPUT" ]; then
            CONFIG_FILE="configs/$CONFIG_INPUT"
          fi

          if [ -n "$CONFIG_FILE" ]; then
            echo "📋 Using local config $CONFIG_FILE..."
            cp "$CONFIG_FILE" kernel_build/.config
          else
            CLEAN_CONFIG="${CONFIG_INPUT#configs/}"
            CONFIG_URL="${RAW_BASE_URL}configs/${CLEAN_CONFIG}"
            echo "⬇️ Downloading config from $CONFIG_URL..."
            curl -fL --retry 3 --retry-all-errors \
              -o kernel_build/.config \
              "$CONFIG_URL"
          fi

          cd kernel_build
          chmod -R +x scripts/
          find . -type f \( -name "*.sh" -o -name "*.pl" -o -name "*.py" \) -exec chmod +x {} +

          echo "🔧 Applying configuration and running olddefconfig..."
          if ! make olddefconfig 2>&1 | tee ../build-config.log; then
            mkdir -p ../artifacts
            cp ../build-config.log "../build-error-${{ matrix.target.id }}.log"
            cp ../build-config.log "../artifacts/build-error-${{ matrix.target.id }}.log"
            exit 1
          fi

      - name: 🔑 Inject MOK certificates from secrets
        working-directory: kernel_build
        env:
          MOK_PEM: ${{ secrets.MOK_PEM }}
          MOK_SIGNING_PEM: ${{ secrets.MOK_SIGNING_PEM }}
        run: |
          mkdir -p certs
          if [ -n "$MOK_SIGNING_PEM" ] && [ -n "$MOK_PEM" ]; then
            echo "🔑 Installing MOK certificates..."
            echo "$MOK_SIGNING_PEM" > certs/MOK-signing.pem
            echo "$MOK_PEM" > certs/MOK.pem
            chmod 600 certs/MOK-signing.pem
            chmod 644 certs/MOK.pem
            echo "✅ MOK certificates installed into certs/"
          else
            echo "⚠️ Warning: MOK secrets are empty or not configured"
          fi

      - name: 🐧 Build kernel
        working-directory: kernel_build
        shell: bash
        run: |
          set -o pipefail

          export DEB_BUILD_OPTIONS="parallel=$(nproc)"

          chmod -R +x scripts/
          find . -type f \( -name "*.sh" -o -name "*.pl" -o -name "*.py" \) -exec chmod +x {} +

          KERNEL_VER=$(make kernelversion)
          CONFIG_INPUT="${{ matrix.target.config_path }}"
          LOCAL_VER="${{ matrix.target.local_version }}"
          KCFLAGS="${{ matrix.target.kcflags }}"
          KCPPFLAGS="${{ matrix.target.kcppflags }}"
          TARGET="${{ matrix.target.name }}"

          echo "========================================="
          echo "🐧 Environment Kernel Build"
          echo "========================================="
          echo "Target         : $TARGET"
          echo "Kernel version : $KERNEL_VER"
          echo "Local version  : $LOCAL_VER"
          echo "Package version: ${KERNEL_VER}${LOCAL_VER}"
          echo "Config         : $CONFIG_INPUT"
          echo "KCFLAGS        : $KCFLAGS"
          echo "KCPPFLAGS      : $KCPPFLAGS"
          echo "Build jobs     : $(nproc)"
          echo "GCC            : $(gcc --version | head -n1)"
          echo "G++            : $(g++ --version | head -n1)"
          echo "Pahole         : $(pahole --version 2>&1 || echo 'Not found')"
          echo "Make           : $(make --version | head -n1)"
          echo "========================================="

          BUILD_LOG="../build-${{ matrix.target.id }}.log"
          ERROR_LOG="../build-error-${{ matrix.target.id }}.log"

          rm -f "$BUILD_LOG" "$ERROR_LOG"

          echo "🚀 Starting kernel compilation..."

          if make -j$(nproc) bindeb-pkg \
              KCFLAGS="$KCFLAGS" \
              KCPPFLAGS="$KCPPFLAGS" \
              LOCALVERSION="$LOCAL_VER" \
              KDEB_PKGVERSION="${KERNEL_VER}${LOCAL_VER}" \
              KDEB_CHANGELOG_DIST="trixie" \
              2>&1 | tee "$BUILD_LOG"
          then
              cp "$BUILD_LOG" ../build-kernel.log 2>/dev/null || true
              echo "========================================="
              echo "✅ Kernel compilation completed successfully for $TARGET"
              echo "========================================="
          else
              BUILD_EXIT=${PIPESTATUS[0]}
              cp "$BUILD_LOG" ../build-kernel.log 2>/dev/null || true

              echo "========================================="
              echo "❌ Kernel compilation FAILED for $TARGET"
              echo "Exit code: $BUILD_EXIT"
              echo "========================================="

              {
                echo "========================================="
                echo "POSSIBLE ROOT CAUSES ($TARGET)"
                echo "========================================="

                grep -nEi \
                  '(^|[[:space:]])(error|fatal):|undefined reference|cannot find|No such file|Killed|out of memory|oom|pahole|BTF|DWARF|segmentation fault|internal compiler error' \
                  "$BUILD_LOG" || true

                echo
                echo "========================================="
                echo "LAST 150 LINES ($TARGET)"
                echo "========================================="

                tail -n 150 "$BUILD_LOG"
              } > "$ERROR_LOG"

              echo
              cat "$ERROR_LOG"

              exit "$BUILD_EXIT"
          fi

      - name: 🔒 Securely remove MOK signing key
        if: always()
        run: |
          rm -f kernel_build/certs/MOK-signing.pem kernel_build/certs/MOK.pem

      - name: 📦 Move .deb, logs & prepare release notes snippet
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts

          echo "📦 Collecting build artifacts for ${{ matrix.target.name }}..."

          find . -maxdepth 1 -name "*.deb" -exec cp {} artifacts/ \; || true
          find . -maxdepth 1 -name "*.changes" -exec cp {} artifacts/ \; || true
          find . -maxdepth 1 -name "*.buildinfo" -exec cp {} artifacts/ \; || true

          if [ -f "build-${{ matrix.target.id }}.log" ]; then
            cp "build-${{ matrix.target.id }}.log" "artifacts/build-${{ matrix.target.id }}.log"
          fi

          if [ -f "build-error-${{ matrix.target.id }}.log" ]; then
            cp "build-error-${{ matrix.target.id }}.log" "artifacts/build-error-${{ matrix.target.id }}.log"
          fi

          CHANGES_FILE=$(find . -maxdepth 1 -name "*${{ matrix.target.local_version }}*.changes" | head -n1)
          if [ -z "$CHANGES_FILE" ]; then
            CHANGES_FILE=$(find . -maxdepth 1 -name "*.changes" | head -n1)
          fi

          if [ -n "$CHANGES_FILE" ]; then
            get_field() {
              awk -F': ' -v key="$1" '$1==key {print $2}' "$CHANGES_FILE"
            }

            FORMAT=$(get_field "Format")
            DATE=$(get_field "Date")
            SOURCE=$(get_field "Source")
            ARCH=$(get_field "Architecture")
            VERSION=$(get_field "Version")
            DIST=$(get_field "Distribution")
            URGENCY=$(get_field "Urgency")
            MAINTAINER=$(get_field "Maintainer")
            CHANGED_BY=$(get_field "Changed-By")
            BINARIES=$(get_field "Binary" | sed 's/ /\` \`/g; s/^/\`/; s/$/\`/')

            DESCRIPTION=$(awk '
              /^Description:/ {flag=1; next}
              /^Changes:/ {flag=0}
              flag && NF {print " - "$0}
            ' "$CHANGES_FILE")

            SHA1=$(awk '
              /^Checksums-Sha1:/ {flag=1; next}
              /^Checksums-Sha256:/ {flag=0}
              flag && NF {print}
            ' "$CHANGES_FILE")

            SHA256=$(awk '
              /^Checksums-Sha256:/ {flag=1; next}
              /^Files:/ {flag=0}
              flag && NF {print}
            ' "$CHANGES_FILE")

            FILES=$(awk '
              /^Files:/ {flag=1; next}
              flag && NF {print}
            ' "$CHANGES_FILE")

            {
              echo "### 🎯 Target: ${{ matrix.target.name }}"
              echo "- **Version:** $VERSION"
              echo "- **Architecture:** $ARCH"
              echo "- **KCFLAGS:** \`${{ matrix.target.kcflags }}\`"
              echo "- **KCPPFLAGS:** \`${{ matrix.target.kcppflags }}\`"
              echo "- **Config:** \`${{ matrix.target.config_path }}\`"
              echo "- **Binary Packages:** $BINARIES"
              echo "- **Distribution:** $DIST | **Date:** $DATE"
              echo
              echo "#### 📝 Description:"
              echo "$DESCRIPTION"
              echo
              echo "#### ✅ Checksums-Sha256:"
              echo '```text'
              echo "$SHA256"
              echo '```'
              echo
              echo "#### 📦 Files:"
              echo '```text'
              echo "$FILES"
              echo '```'
            } > "artifacts/release-section-${{ matrix.target.id }}.md"
          fi

          echo "========================================="
          echo "📁 Collected artifacts for ${{ matrix.target.name }}"
          echo "========================================="
          ls -lh artifacts/

      - name: 📤 Upload compiled kernel artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiled-kernel-artifacts-${{ matrix.target.id }}
          path: artifacts/

  release:
    name: 🚀 3. Publish Unified Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: success()

    outputs:
      release_body: ${{ steps.release_body.outputs.body }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📥 Download all compiled kernel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: compiled-kernel-artifacts-*
          path: all-artifacts
          merge-multiple: true

      - name: 📋 Generate unified release notes
        id: release_body
        shell: bash
        run: |
          GIT_CHANGELOG=$(git log -n 10 --pretty=format:"* %h - %s (%an, %cr)" 2>/dev/null || echo " * Custom built Linux kernel.")

          {
            echo "## 🐧 Linux Kernel Release (${{ needs.prepare.outputs.kernel_tag }})"
            echo
            echo "**Target Selection:** ${{ needs.prepare.outputs.target_choice }}"
            echo "**Config Selection:** \`${{ needs.prepare.outputs.config_choice }}\`"
            echo
            echo "---"
            echo

            for section in all-artifacts/release-section-*.md; do
              if [ -f "$section" ]; then
                cat "$section"
                echo
                echo "---"
                echo
              fi
            done

            echo "### 🔄 Git ChangeLog:"
            echo "$GIT_CHANGELOG"
          } > release.md

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat release.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 🚀 Upload Unified GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: kernel-${{ github.run_number }}
          name: "Kernel ${{ needs.prepare.outputs.kernel_tag }} (Build #${{ github.run_number }})"
          body: ${{ steps.release_body.outputs.body }}
          files: |
            all-artifacts/*.deb
            all-artifacts/*.buildinfo
            all-artifacts/*.changes
            all-artifacts/*.log
          overwrite_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-telegram:
    name: 📤 4. Telegram Notification
    needs: [prepare, build, release]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download all compiled artifacts & logs
        uses: actions/download-artifact@v8
        with:
          pattern: compiled-kernel-artifacts-*
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: 📤 Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
          BUILD_STATUS: ${{ needs.build.result }}
          RELEASE_STATUS: ${{ needs.release.result }}
          KERNEL_TAG: ${{ needs.prepare.outputs.kernel_tag }}
          TARGET_CHOICE: ${{ needs.prepare.outputs.target_choice }}
          CONFIG_CHOICE: ${{ needs.prepare.outputs.config_choice }}
          KERNEL_URL: ${{ needs.prepare.outputs.download_url }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$BUILD_STATUS" = "success" ] && [ "$RELEASE_STATUS" = "success" ]; then
            DEB_LIST=$(find artifacts/ -name "*.deb" -exec basename {} \; 2>/dev/null | sort -u | sed 's/^/ • /')
            if [ -z "$DEB_LIST" ]; then
              DEB_LIST=" • Paquetes generados correctamente"
            fi

            MESSAGE=$(printf "%s\n" \
              "<b>🐧 Linux Kernel Build ✅ Success</b>" \
              "" \
              "🎯 <b>Objetivo(s):</b> ${TARGET_CHOICE}" \
              "📄 <b>Config:</b> ${CONFIG_CHOICE}" \
              "🏷️ <b>Versión Base:</b> ${KERNEL_TAG:-Desconocida}" \
              "🚀 <b>Release:</b> <a href=\"https://github.com/${GITHUB_REPOSITORY}/releases/tag/kernel-${RUN_NUMBER}\">kernel-${RUN_NUMBER}</a>" \
              "" \
              "📦 <b>Paquetes .deb generados:</b>" \
              "<code>${DEB_LIST}</code>" \
              "" \
              "🏷️ <b>Workflow:</b>" \
              "🔗 <a href=\"${RUN_URL}\">Link to GitHub</a>")

          else
            ERROR_SNIPPET=""
            for err_file in artifacts/build-error-*.log; do
              if [ -f "$err_file" ]; then
                SNIP=$(tail -n 30 "$err_file" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
                ERROR_SNIPPET=$(printf "%b\n<b>[%s]:</b>\n<pre>%s</pre>" "$ERROR_SNIPPET" "$(basename "$err_file")" "$SNIP")
              fi
            done

            if [ -z "$ERROR_SNIPPET" ]; then
              for log_file in artifacts/build-*.log; do
                if [ -f "$log_file" ]; then
                  SNIP=$(tail -n 30 "$log_file" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
                  ERROR_SNIPPET=$(printf "%b\n<b>[%s]:</b>\n<pre>%s</pre>" "$ERROR_SNIPPET" "$(basename "$log_file")" "$SNIP")
                fi
              done
            fi

            if [ -z "$ERROR_SNIPPET" ]; then
              ERROR_SNIPPET="⚠️ <b>No se encontró ningún log detallado de error en los artefactos.</b>"
            fi

            SRC_INFO="${KERNEL_TAG}"
            if [ -z "$SRC_INFO" ]; then
              SRC_INFO="${KERNEL_URL:-$DEFAULT_URL}"
            fi

            MESSAGE=$(printf "%s\n" \
              "<b>🐧 Linux Kernel Build ❌ Fallido (Build: ${BUILD_STATUS^}, Release: ${RELEASE_STATUS^})</b>" \
              "" \
              "⚠️ <b>Parámetros de la ejecución:</b>" \
              "• <b>Objetivo(s):</b> ${TARGET_CHOICE}" \
              "• <b>Config:</b> ${CONFIG_CHOICE}" \
              "• <b>Origen:</b> ${SRC_INFO}" \
              "" \
              "📋 <b>Diagnóstico del error:</b>" \
              "${ERROR_SNIPPET}" \
              "" \
              "🏷️ <b>Workflow:</b>" \
              "🔗 <a href=\"${RUN_URL}\">Ver logs completos en GitHub Actions</a>")
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHATID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$MESSAGE" \
            >/dev/null 2>&1
