name: 🐧 Build kernel

on:
  workflow_dispatch:
    inputs:
      target:
        description: '🎯 Select a device'
        required: true
        type: choice
        options:
          - 'AMD Ryzen 9'
          - 'Lenovo Thinkpad T440p'
          - 'Both'
        default: 'Both'
      config:
        description: '📄 Kernel configuration file (kernel version is taken from its name)'
        required: true
        type: choice
        options:
          - 'stable'
          - 'custom'
          - 'configs/stable/config-7.3.4-ryzen9-debian13'
          - 'configs/stable/config-7.3.4-t440p-debian13'
        default: 'stable'
      custom_config:
        description: '⚙️ Custom config path (used if config is "custom")'
        required: false
        default: ''
      url:
        description: '📦 Kernel tarball URL (optional override; default: auto-downloaded from kernel.org)'
        required: false
        default: ''
      tag:
        description: '🏷️ Git tag from torvalds/linux repo (optional override, used if no URL and specified)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_OPTIONS: "--no-deprecation"
  RAW_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/"
  KERNEL_TARGET: ${{ inputs.target }}
  KERNEL_CONFIG: ${{ inputs.config }}
  KERNEL_URL: ${{ inputs.url }}
  KERNEL_TAG: ${{ inputs.tag }}

jobs:
  validate-config:
    name: 🔍 1. Validate Kernel Config & Resolve Matrix
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: -v /:/host

    outputs:
      kernel_tag: ${{ steps.validate.outputs.kernel_tag }}
      targets_matrix: ${{ steps.validate.outputs.targets_matrix }}
      target_choice: ${{ inputs.target }}
      config_choice: ${{ steps.validate.outputs.config_choice }}
      download_url: ${{ steps.validate.outputs.kernel_url }}

    steps:
      - name: 🛠️ Prepare container base tools & kconfig toolchain
        run: |
          apt-get update -qq
          apt-get install -y \
            build-essential \
            gcc-14 \
            g++-14 \
            fakeroot \
            bc \
            bison \
            flex \
            zstd \
            libdw-dev \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            dwarves \
            debhelper \
            rsync \
            python3 \
            curl \
            jq \
            patch \
            kmod \
            perl \
            mawk \
            tar \
            xz-utils \
            git \
            procps \
            sudo \
            ccache \
            lz4
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: 🔍 Validate .config & resolve targets
        id: validate
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
        run: |
          set -e
          TARGET="${{ inputs.target }}"
          SELECTED_CONFIG="${{ inputs.config }}"
          CUSTOM_CONFIG="${{ inputs.custom_config }}"
          INPUT_URL="${{ inputs.url }}"
          INPUT_TAG="${{ inputs.tag }}"

          if [ "$SELECTED_CONFIG" = "custom" ] && [ -n "$CUSTOM_CONFIG" ]; then
            SELECTED_CONFIG="$CUSTOM_CONFIG"
          fi
          [ -z "$SELECTED_CONFIG" ] && SELECTED_CONFIG="stable"

          # Normalize user-provided path
          if [ "$SELECTED_CONFIG" != "stable" ]; then
            if [ -f "$SELECTED_CONFIG" ]; then :
            elif [ -f "configs/$SELECTED_CONFIG" ]; then SELECTED_CONFIG="configs/$SELECTED_CONFIG"
            else
              echo "❌ Config file not found: $SELECTED_CONFIG"
              exit 1
            fi
          fi

          # Newest config in configs/stable for a device id (e.g. ryzen9, t440p)
          stable_for() {
            find configs/stable -maxdepth 1 -type f -name "config-*-$1-*" 2>/dev/null | sort -V | tail -n1
          }

          # Pick config for a device: $1=device id, $2=other device id
          resolve_config() {
            if [ "$SELECTED_CONFIG" = "stable" ] || [[ "$(basename "$SELECTED_CONFIG")" == *"-$2-"* ]]; then
              stable_for "$1"
            else
              echo "$SELECTED_CONFIG"
            fi
          }

          # Extract kernel version from filename or config header
          version_of() {
            local v
            v=$(basename "$1" | sed -nE 's/^config-([0-9]+(\.[0-9]+)+).*/\1/p')
            if [ -z "$v" ]; then
              v=$(grep -m1 -E '^# Linux/[a-z0-9_]+ [0-9]' "$1" | awk '{print $3}')
            fi
            echo "$v"
          }

          # Tarball URL builder
          tarball_url() {
            local v="$1" tv major
            tv="$v"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.0$ ]] && tv="${v%.0}"
            major="${v%%.*}"
            echo "https://www.kernel.org/pub/linux/kernel/v${major}.x/linux-${tv}.tar.gz"
          }

          RYZEN_CONFIG=$(resolve_config ryzen9 t440p)
          LENOVO_CONFIG=$(resolve_config t440p ryzen9)

          build_target_json() {
            local ver url method tag
            if [ -z "$3" ] || [ ! -f "$3" ]; then
              echo "❌ Config not found for $2: '$3'" >&2
              exit 1
            fi
            ver=$(version_of "$3")
            if [ -z "$ver" ]; then
              echo "❌ Cannot determine kernel version from $3" >&2
              exit 1
            fi
            if [ -n "$INPUT_URL" ]; then
              method="url"; url="$INPUT_URL"; tag=""
            elif [ -n "$INPUT_TAG" ]; then
              method="tag"; url=""; tag="$INPUT_TAG"
            else
              method="url"; url=$(tarball_url "$ver"); tag=""
            fi
            jq -cn --arg id "$1" --arg name "$2" --arg cfg "$3" --arg kc "$4" --arg kpp "$5" \
              --arg af "$6" --arg lv "$7" --arg ver "$ver" --arg url "$url" --arg method "$method" --arg tag "$tag" \
              '{id:$id,name:$name,config_path:$cfg,kcflags:$kc,kcppflags:$kpp,arch_flags:$af,local_version:$lv,
                kernel_version:$ver,kernel_url:$url,download_method:$method,git_tag:$tag}'
          }

          RYZEN_JSON=$(build_target_json ryzen9 "AMD Ryzen 9" "$RYZEN_CONFIG" \
            "-march=znver3 -O2 -pipe" "-march=znver3 -mtune=znver3" "-march=znver3 -O2 -pipe" "-ryzen9")
          LENOVO_JSON=$(build_target_json t440p "Lenovo Thinkpad T440p" "$LENOVO_CONFIG" \
            "-march=haswell -mtune=haswell -O2 -pipe" "-march=haswell -mtune=haswell" "-march=haswell -mtune=haswell -O2 -pipe" "-t440p")

          case "$TARGET" in
            "AMD Ryzen 9")
              MATRIX="[$RYZEN_JSON]"
              CONFIG_CHOICE="$RYZEN_CONFIG"
              ;;
            "Lenovo Thinkpad T440p")
              MATRIX="[$LENOVO_JSON]"
              CONFIG_CHOICE="$LENOVO_CONFIG"
              ;;
            "Both")
              MATRIX="[$RYZEN_JSON,$LENOVO_JSON]"
              CONFIG_CHOICE="Both"
              ;;
            *)
              echo "❌ Invalid target: $TARGET"
              exit 1
              ;;
          esac

          KERNEL_TAG=$(echo "$MATRIX" | jq -r '[.[] | (if .git_tag != "" then .git_tag else .kernel_version end)] | unique | join(" / ")')
          KERNEL_URL=$(echo "$MATRIX" | jq -r '[.[].kernel_url] | unique | join(" ")')

          echo "targets_matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "kernel_tag=$KERNEL_TAG" >> "$GITHUB_OUTPUT"
          echo "kernel_url=$KERNEL_URL" >> "$GITHUB_OUTPUT"
          echo "config_choice=$CONFIG_CHOICE" >> "$GITHUB_OUTPUT"

          echo "========================================="
          echo "🎯 Target Option      : $TARGET"
          echo "📄 Config Selected    : $SELECTED_CONFIG"
          echo "🏷️ Kernel Version(s)  : $KERNEL_TAG"
          echo "📦 Targets Matrix     :"
          echo "$MATRIX" | jq .
          echo "========================================="

          # -------------------------------------------------------------
          # Download Kernel source trees for validation
          # -------------------------------------------------------------
          mkdir -p val_sources
          for item in $(echo "$MATRIX" | jq -r '.[] | @base64'); do
            _jq() { echo "$item" | base64 --decode | jq -r "$1"; }
            V_VER=$(_jq '.kernel_version')
            V_METHOD=$(_jq '.download_method')
            V_URL=$(_jq '.kernel_url')
            V_TAG=$(_jq '.git_tag')

            SRC_DIR="val_sources/linux-${V_VER}"
            if [ ! -d "$SRC_DIR" ]; then
              echo "⬇️ Downloading kernel source for validation: ${V_VER}..."
              mkdir -p "$SRC_DIR"
              if [ "$V_METHOD" = "tag" ]; then
                git clone --depth 1 --branch "$V_TAG" https://github.com/torvalds/linux "$SRC_DIR"
              else
                case "$(basename "$V_URL")" in
                  *.tar.gz) EXT="gz" ;;
                  *.tar.xz) EXT="xz" ;;
                  *) EXT="gz" ;;
                esac
                ARCHIVE="kernel_pkg_${V_VER}.tar.${EXT}"
                if ! curl -fL --retry 3 --retry-all-errors -o "$ARCHIVE" "$V_URL"; then
                  if [ "$EXT" = "gz" ]; then
                    FALLBACK="${V_URL%.tar.gz}.tar.xz"
                    echo "⚠️ .tar.gz failed, trying fallback: $FALLBACK"
                    curl -fL --retry 3 --retry-all-errors -o "kernel_pkg_${V_VER}.tar.xz" "$FALLBACK"
                    ARCHIVE="kernel_pkg_${V_VER}.tar.xz"
                  else
                    echo "❌ Failed to download kernel from $V_URL"
                    exit 1
                  fi
                fi
                tar -xf "$ARCHIVE" -C "$SRC_DIR" --strip-components=1
                rm -f "$ARCHIVE"
              fi
            fi
          done

          # -------------------------------------------------------------
          # Perform olddefconfig check and diff detection for each target
          # -------------------------------------------------------------
          VALIDATION_FAILED=false
          SUMMARY_TABLE=""
          ERROR_DETAILS=""
          TELEGRAM_ERRORS=""

          for item in $(echo "$MATRIX" | jq -r '.[] | @base64'); do
            _jq() { echo "$item" | base64 --decode | jq -r "$1"; }
            T_ID=$(_jq '.id')
            T_NAME=$(_jq '.name')
            T_CFG=$(_jq '.config_path')
            T_VER=$(_jq '.kernel_version')
            SRC_DIR="val_sources/linux-${T_VER}"

            echo "========================================="
            echo "🔍 Testing olddefconfig for $T_NAME ($T_CFG)..."
            echo "========================================="

            cp "$T_CFG" "$SRC_DIR/.config"
            chmod -R +x "$SRC_DIR/scripts/" || true

            set +e
            OLDDEF_OUT=$(make -C "$SRC_DIR" olddefconfig 2>&1)
            OLDDEF_EXIT=$?
            set -e

            echo "$OLDDEF_OUT"

            DIFF_FILE="diff-${T_ID}.log"
            rm -f "$DIFF_FILE"

            if [ -f "$SRC_DIR/scripts/diffconfig" ]; then
              python3 "$SRC_DIR/scripts/diffconfig" "$T_CFG" "$SRC_DIR/.config" > "$DIFF_FILE" 2>/dev/null || true
            else
              diff -u <(grep -E '^[A-Z0-9_]+=' "$T_CFG" | sort) <(grep -E '^[A-Z0-9_]+=' "$SRC_DIR/.config" | sort) > "$DIFF_FILE" || true
            fi

            if [ "$OLDDEF_EXIT" -ne 0 ]; then
              VALIDATION_FAILED=true
              SUMMARY_TABLE="${SUMMARY_TABLE}| ${T_NAME} | \`${T_VER}\` | \`${T_CFG}\` | ❌ Error in \`make olddefconfig\` |\n"
              ERR_SNIP=$(tail -n 25 <<< "$OLDDEF_OUT")
              ERROR_DETAILS="${ERROR_DETAILS}\n### ❌ ${T_NAME}: Error executing \`make olddefconfig\`\n\`\`\`text\n${ERR_SNIP}\n\`\`\`\n"
              TELEGRAM_ERRORS="${TELEGRAM_ERRORS}\n<b>[${T_NAME}]: Error in make olddefconfig</b>\n<pre>$(echo "$ERR_SNIP" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')</pre>\n"
            elif echo "$OLDDEF_OUT" | grep -q "configuration written to \.config" || [ -s "$DIFF_FILE" ]; then
              VALIDATION_FAILED=true
              DIFF_COUNT=$(wc -l < "$DIFF_FILE" 2>/dev/null || echo "0")
              SUMMARY_TABLE="${SUMMARY_TABLE}| ${T_NAME} | \`${T_VER}\` | \`${T_CFG}\` | ❌ Modifications detected (${DIFF_COUNT} options) |\n"

              echo "❌ [MODIFICATIONS DETECTED] ${T_NAME} produced 'configuration written to .config' (${DIFF_COUNT} diffconfig changes):"
              if [ -s "$DIFF_FILE" ]; then
                cat "$DIFF_FILE"
              else
                echo "$OLDDEF_OUT" | grep -A 5 -B 2 "configuration written to \.config" || true
              fi

              DIFF_PREVIEW=""
              if [ -s "$DIFF_FILE" ]; then
                DIFF_PREVIEW=$(head -n 40 "$DIFF_FILE")
              else
                DIFF_PREVIEW=$(tail -n 25 <<< "$OLDDEF_OUT")
              fi

              ERROR_DETAILS="${ERROR_DETAILS}\n### ⚠️ ${T_NAME}: Modifications detected in .config\n<details open><summary><b>View differences (diffconfig / olddefconfig)</b></summary>\n\n\`\`\`text\n${DIFF_PREVIEW}\n\`\`\`\n</details>\n"

              TG_SNIP=$(head -n 25 "$DIFF_FILE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
              if [ -z "$TG_SNIP" ]; then
                TG_SNIP=$(tail -n 15 <<< "$OLDDEF_OUT" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
              elif [ "$DIFF_COUNT" -gt 25 ]; then
                TG_SNIP="${TG_SNIP}\n... (+ $((DIFF_COUNT - 25)) additional options)"
              fi
              TELEGRAM_ERRORS="${TELEGRAM_ERRORS}\n<b>[${T_NAME}]: Modifications in .config</b>\n<pre>${TG_SNIP}</pre>\n"
            else
              SUMMARY_TABLE="${SUMMARY_TABLE}| ${T_NAME} | \`${T_VER}\` | \`${T_CFG}\` | ✅ Synchronized (# No change to .config) |\n"
              echo "✅ [OK] Config for $T_NAME is 100% synchronized with olddefconfig (# No change to .config)."
            fi
          done

          # -------------------------------------------------------------
          # Generate GitHub Step Summary
          # -------------------------------------------------------------
          {
            echo "# 🔍 Kernel Configuration Validation"
            echo
            echo "| Device | Kernel Version | Configuration | Status |"
            echo "| :--- | :--- | :--- | :--- |"
            printf "%b" "$SUMMARY_TABLE"
            echo
            if [ "$VALIDATION_FAILED" = "true" ]; then
              echo "> 🛑 **Validation FAILED:** Automatic modifications were detected with \`make olddefconfig\` or syntax errors occurred. The workflow has been aborted to prevent compiling with unexpected configurations."
              echo
              printf "%b" "$ERROR_DETAILS"
              echo
              echo "---"
              echo "💡 **Resolution:** Review the differences shown above, update your \`.config\` file in the repository for the target version, and commit the changes before retrying."
            else
              echo "> ✅ **Validation SUCCESSFUL (# No change to .config):** All selected configurations match kernel requirements exactly. Proceeding with Job 2 (Build environment & compilation)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # -------------------------------------------------------------
          # Telegram notification & workflow flow control
          # -------------------------------------------------------------
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$VALIDATION_FAILED" = "true" ]; then
            if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHATID" ]; then
              TG_MSG=$(printf "%s\n" \
                "<b>🐧 Linux Kernel: Config Validation Failed 🛑</b>" \
                "" \
                "🎯 <b>Target(s):</b> ${TARGET}" \
                "🏷️ <b>Version:</b> ${KERNEL_TAG}" \
                "⚠️ <b>Reason:</b>" \
                "<code>make olddefconfig</code> detected modifications (<code># configuration written to .config</code>). Execution aborted to prevent building an inconsistent kernel." \
                "" \
                "📋 <b>Detected Differences (diffconfig):</b>" \
                "$(printf "%b" "$TELEGRAM_ERRORS")" \
                "" \
                "🔗 <a href=\"${RUN_URL}\">View details on GitHub Actions</a>")

              curl -s -X POST \
                "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHATID}" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode "text=$TG_MSG" \
                >/dev/null 2>&1 || true
            fi

            echo "❌ [ABORT] Config validation failed. Canceling compilation."
            exit 1
          else
            if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHATID" ]; then
              TG_OK_MSG=$(printf "%s\n" \
                "<b>🐧 Linux Kernel: Configuration Verified ✅</b>" \
                "" \
                "🎯 <b>Target(s):</b> ${TARGET}" \
                "🏷️ <b>Version:</b> ${KERNEL_TAG}" \
                "📄 <b>Result:</b> <code># No change to .config</code>" \
                "🚀 <i>Starting compilation in Debian 13 (Trixie) container...</i>" \
                "" \
                "🔗 <a href=\"${RUN_URL}\">View run on GitHub Actions</a>")

              curl -s -X POST \
                "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHATID}" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode "text=$TG_OK_MSG" \
                >/dev/null 2>&1 || true
            fi

            echo "✅ Configuration validation succeeded (# No change to .config)."
          fi

  build-kernel:
    name: 🐧 2. Build (${{ matrix.target.name }})
    needs: validate-config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.validate-config.outputs.targets_matrix) }}
    container:
      image: debian:trixie
      options: -v /:/host

    steps:
      - name: 🛠️ Prepare container environment & install build toolchain
        run: |
          apt-get update -qq
          apt-get install -y \
            build-essential \
            gcc-14 \
            g++-14 \
            fakeroot \
            bc \
            bison \
            flex \
            zstd \
            libdw-dev \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            dwarves \
            debhelper \
            rsync \
            python3 \
            curl \
            jq \
            patch \
            kmod \
            perl \
            mawk \
            tar \
            xz-utils \
            git \
            procps \
            sudo \
            ccache \
            lz4
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🧹 Clean up host runner space & drop RAM caches
        run: |
          rm -rf /host/usr/share/dotnet \
                 /host/usr/local/lib/android \
                 /host/opt/ghc \
                 /host/opt/hostedtoolcache || true

      - name: 📥 Download kernel source (version from config)
        if: matrix.target.download_method == 'url'
        shell: bash
        run: |
          URL="${{ matrix.target.kernel_url }}"
          echo "⬇️ Kernel ${{ matrix.target.kernel_version }} for ${{ matrix.target.name }}: $URL"

          case "$(basename "$URL")" in
            *.tar.gz) EXT="gz" ;;
            *.tar.xz) EXT="xz" ;;
            *)
              echo "❌ Only .tar.gz or .tar.xz URLs are allowed: $URL"
              exit 1
              ;;
          esac

          if ! curl -fL --retry 3 --retry-all-errors -o "kernel_package.tar.${EXT}" "$URL"; then
            if [ "$EXT" = "gz" ]; then
              FALLBACK_URL="${URL%.tar.gz}.tar.xz"
              echo "⚠️ .tar.gz failed, attempting fallback: $FALLBACK_URL"
              curl -fL --retry 3 --retry-all-errors -o "kernel_package.tar.xz" "$FALLBACK_URL"
              EXT="xz"
            else
              echo "❌ Failed to download kernel package from $URL"
              exit 1
            fi
          fi

          mkdir -p kernel_build
          tar -xf "kernel_package.tar.${EXT}" -C kernel_build --strip-components=1
          rm -f "kernel_package.tar.${EXT}"

      - name: 📥 Clone torvalds/linux repo
        if: matrix.target.download_method == 'tag'
        run: |
          git clone --depth 1 --branch "${{ matrix.target.git_tag }}" \
            https://github.com/torvalds/linux kernel_build

      - name: 🔍 Verify kernel source
        run: |
          if [ ! -f kernel_build/Makefile ]; then
            echo "❌ No valid kernel source available!"
            exit 1
          fi
          echo "✅ Kernel source verified"

      - name: 🔧 Restore execution permissions on kernel scripts
        run: |
          chmod -R +x kernel_build/scripts/
          find kernel_build -type f \( -name "*.sh" -o -name "*.pl" -o -name "*.py" \) -exec chmod +x {} +

      - name: 📄 Apply verified kernel config
        shell: bash
        run: |
          CONFIG_INPUT="${{ matrix.target.config_path }}"
          echo "Applying config: $CONFIG_INPUT for ${{ matrix.target.name }}"

          CONFIG_FILE=""
          if [ -f "$CONFIG_INPUT" ]; then
            CONFIG_FILE="$CONFIG_INPUT"
          elif [ -f "configs/$CONFIG_INPUT" ]; then
            CONFIG_FILE="configs/$CONFIG_INPUT"
          fi

          if [ -n "$CONFIG_FILE" ]; then
            echo "📋 Using local config $CONFIG_FILE..."
            cp "$CONFIG_FILE" kernel_build/.config
          else
            CLEAN_CONFIG="${CONFIG_INPUT#configs/}"
            CONFIG_URL="${RAW_BASE_URL}configs/${CLEAN_CONFIG}"
            echo "⬇️ Downloading config from $CONFIG_URL..."
            curl -fL --retry 3 --retry-all-errors \
              -o kernel_build/.config \
              "$CONFIG_URL"
          fi

          cd kernel_build
          chmod -R +x scripts/
          find . -type f \( -name "*.sh" -o -name "*.pl" -o -name "*.py" \) -exec chmod +x {} +

          echo "🔧 Running olddefconfig to prepare build tree headers..."
          if ! make olddefconfig 2>&1 | tee ../build-config.log; then
            mkdir -p ../artifacts
            cp ../build-config.log "../build-error-${{ matrix.target.id }}.log"
            cp ../build-config.log "../artifacts/build-error-${{ matrix.target.id }}.log"
            exit 1
          fi

      - name: 🔑 Inject MOK signing key from secrets
        working-directory: kernel_build
        env:
          MOK_SIGNING_PEM: ${{ secrets.MOK_SIGNING_PEM }}
        run: |
          mkdir -p certs
          if [ -n "$MOK_SIGNING_PEM" ]; then
            echo "🔑 Installing MOK signing key..."
            echo "$MOK_SIGNING_PEM" > certs/MOK-signing.pem
            chmod 600 certs/MOK-signing.pem
            echo "✅ MOK signing key installed into certs/"
          else
            echo "⚠️ Warning: MOK_SIGNING_PEM secret is empty or not configured"
          fi

      - name: 🐧 Build kernel deb packages
        working-directory: kernel_build
        shell: bash
        run: |
          set -o pipefail

          export DEB_BUILD_OPTIONS="parallel=$(nproc)"

          chmod -R +x scripts/
          find . -type f \( -name "*.sh" -o -name "*.pl" -o -name "*.py" \) -exec chmod +x {} +

          KERNEL_VER=$(make kernelversion)
          CONFIG_INPUT="${{ matrix.target.config_path }}"
          LOCAL_VER="${{ matrix.target.local_version }}"
          KCFLAGS="${{ matrix.target.kcflags }}"
          KCPPFLAGS="${{ matrix.target.kcppflags }}"
          TARGET="${{ matrix.target.name }}"

          echo "========================================="
          echo "🐧 Environment Kernel Build"
          echo "========================================="
          echo "Target         : $TARGET"
          echo "Kernel version : $KERNEL_VER"
          echo "Local version  : $LOCAL_VER"
          echo "Package version: ${KERNEL_VER}${LOCAL_VER}"
          echo "Config         : $CONFIG_INPUT"
          echo "KCFLAGS        : $KCFLAGS"
          echo "KCPPFLAGS      : $KCPPFLAGS"
          echo "Build jobs     : $(nproc)"
          echo "GCC            : $(gcc --version | head -n1)"
          echo "G++            : $(g++ --version | head -n1)"
          echo "Pahole         : $(pahole --version 2>&1 || echo 'Not found')"
          echo "Make           : $(make --version | head -n1)"
          echo "========================================="

          BUILD_LOG="../build-${{ matrix.target.id }}.log"
          ERROR_LOG="../build-error-${{ matrix.target.id }}.log"

          rm -f "$BUILD_LOG" "$ERROR_LOG"

          echo "🚀 Starting kernel compilation..."

          if make -j$(nproc) bindeb-pkg \
              KCFLAGS="$KCFLAGS" \
              KCPPFLAGS="$KCPPFLAGS" \
              LOCALVERSION="$LOCAL_VER" \
              KDEB_PKGVERSION="${KERNEL_VER}${LOCAL_VER}" \
              KDEB_CHANGELOG_DIST="trixie" \
              2>&1 | tee "$BUILD_LOG"
          then
              cp "$BUILD_LOG" ../build-kernel.log 2>/dev/null || true
              echo "========================================="
              echo "✅ Kernel compilation completed successfully for $TARGET"
              echo "========================================="
          else
              BUILD_EXIT=${PIPESTATUS[0]}
              cp "$BUILD_LOG" ../build-kernel.log 2>/dev/null || true

              echo "========================================="
              echo "❌ Kernel compilation FAILED for $TARGET"
              echo "Exit code: $BUILD_EXIT"
              echo "========================================="

              {
                echo "========================================="
                echo "POSSIBLE ROOT CAUSES ($TARGET)"
                echo "========================================="

                grep -nEi \
                  '(^|[[:space:]])(error|fatal):|undefined reference|cannot find|No such file|Killed|out of memory|oom|pahole|BTF|DWARF|segmentation fault|internal compiler error' \
                  "$BUILD_LOG" || true

                echo
                echo "========================================="
                echo "LAST 150 LINES ($TARGET)"
                echo "========================================="

                tail -n 150 "$BUILD_LOG"
              } > "$ERROR_LOG"

              echo
              cat "$ERROR_LOG"

              {
                echo "## ❌ Compilation Failed: $TARGET"
                echo "- **Exit code:** \`$BUILD_EXIT\`"
                echo
                echo "### 📋 Possible Root Causes:"
                echo '```text'
                head -n 40 "$ERROR_LOG"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"

              exit "$BUILD_EXIT"
          fi

      - name: 🔒 Securely remove MOK signing key
        if: always()
        run: |
          rm -f kernel_build/certs/MOK-signing.pem

      - name: 📦 Move .deb, logs & prepare release notes snippet
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts

          echo "📦 Collecting build artifacts for ${{ matrix.target.name }}..."

          find . -maxdepth 1 -name "*.deb" -exec cp {} artifacts/ \; || true
          find . -maxdepth 1 -name "*.changes" -exec cp {} artifacts/ \; || true
          find . -maxdepth 1 -name "*.buildinfo" -exec cp {} artifacts/ \; || true

          if [ -f "build-${{ matrix.target.id }}.log" ]; then
            cp "build-${{ matrix.target.id }}.log" "artifacts/build-${{ matrix.target.id }}.log"
          fi

          if [ -f "build-error-${{ matrix.target.id }}.log" ]; then
            cp "build-error-${{ matrix.target.id }}.log" "artifacts/build-error-${{ matrix.target.id }}.log"
          fi

          CHANGES_FILE=$(find . -maxdepth 1 -name "*${{ matrix.target.local_version }}*.changes" | head -n1)
          if [ -z "$CHANGES_FILE" ]; then
            CHANGES_FILE=$(find . -maxdepth 1 -name "*.changes" | head -n1)
          fi

          if [ -n "$CHANGES_FILE" ]; then
            get_field() {
              awk -F': ' -v key="$1" '$1==key {print $2}' "$CHANGES_FILE"
            }

            FORMAT=$(get_field "Format")
            DATE=$(get_field "Date")
            SOURCE=$(get_field "Source")
            ARCH=$(get_field "Architecture")
            VERSION=$(get_field "Version")
            DIST=$(get_field "Distribution")
            URGENCY=$(get_field "Urgency")
            MAINTAINER=$(get_field "Maintainer")
            CHANGED_BY=$(get_field "Changed-By")
            BINARIES=$(get_field "Binary" | sed 's/ /\` \`/g; s/^/\`/; s/$/\`/')

            DESCRIPTION=$(awk '
              /^Description:/ {flag=1; next}
              /^Changes:/ {flag=0}
              flag && NF {print " - "$0}
            ' "$CHANGES_FILE")

            SHA1=$(awk '
              /^Checksums-Sha1:/ {flag=1; next}
              /^Checksums-Sha256:/ {flag=0}
              flag && NF {print}
            ' "$CHANGES_FILE")

            SHA256=$(awk '
              /^Checksums-Sha256:/ {flag=1; next}
              /^Files:/ {flag=0}
              flag && NF {print}
            ' "$CHANGES_FILE")

            FILES=$(awk '
              /^Files:/ {flag=1; next}
              flag && NF {print}
            ' "$CHANGES_FILE")

            {
              echo "### 🎯 Target: ${{ matrix.target.name }}"
              echo "- **Version:** $VERSION"
              echo "- **Architecture:** $ARCH"
              echo "- **KCFLAGS:** \`${{ matrix.target.kcflags }}\`"
              echo "- **KCPPFLAGS:** \`${{ matrix.target.kcppflags }}\`"
              echo "- **Config:** \`${{ matrix.target.config_path }}\`"
              echo "- **Binary Packages:** $BINARIES"
              echo "- **Distribution:** $DIST | **Date:** $DATE"
              echo
              echo "#### 📝 Description:"
              echo "$DESCRIPTION"
              echo
              echo "#### ✅ Checksums-Sha256:"
              echo '```text'
              echo "$SHA256"
              echo '```'
              echo
              echo "#### 📦 Files:"
              echo '```text'
              echo "$FILES"
              echo '```'
            } > "artifacts/release-section-${{ matrix.target.id }}.md"

            # Step Summary
            {
              echo "## 🐧 Build: ${{ matrix.target.name }}"
              echo "- **Kernel Version:** \`${VERSION}\`"
              echo "- **Architecture:** \`${ARCH}\`"
              echo "- **Distribution:** \`${DIST}\`"
              echo "- **KCFLAGS:** \`${{ matrix.target.kcflags }}\`"
              echo "- **KCPPFLAGS:** \`${{ matrix.target.kcppflags }}\`"
              echo "- **Configuration:** \`${{ matrix.target.config_path }}\`"
              echo
              echo "### 📦 Generated Debian Packages:"
              echo "| Package | Size | SHA-256 Checksum |"
              echo "| :--- | :--- | :--- |"
              for deb in artifacts/*.deb; do
                if [ -f "$deb" ]; then
                  pkg_name=$(basename "$deb")
                  pkg_size=$(ls -lh "$deb" | awk '{print $5}')
                  pkg_sha=$(sha256sum "$deb" | awk '{print $1}')
                  echo "| \`${pkg_name}\` | ${pkg_size} | \`${pkg_sha}\` |"
                fi
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "========================================="
          echo "📁 Collected artifacts for ${{ matrix.target.name }}"
          echo "========================================="
          ls -lh artifacts/

      - name: 📤 Upload compiled kernel artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compiled-kernel-artifacts-${{ matrix.target.id }}
          path: artifacts/

  release:
    name: 🚀 3. Publish Unified Release
    needs: [validate-config, build-kernel]
    runs-on: ubuntu-latest
    if: success()

    outputs:
      release_body: ${{ steps.release_body.outputs.body }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📥 Download all compiled kernel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: compiled-kernel-artifacts-*
          path: all-artifacts
          merge-multiple: true

      - name: 📋 Generate unified release notes
        id: release_body
        shell: bash
        run: |
          GIT_CHANGELOG=$(git log -n 10 --pretty=format:"* %h - %s (%an, %cr)" 2>/dev/null || echo " * Custom built Linux kernel.")

          {
            echo "## 🐧 Linux Kernel Release (${{ needs.validate-config.outputs.kernel_tag }})"
            if [ "${{ needs.validate-config.outputs.target_choice }}" = "Both" ]; then
              echo "**Target Selection:** Both (AMD Ryzen 9 & Lenovo Thinkpad T440p)"
            else
              echo "**Target Selection:** ${{ needs.validate-config.outputs.target_choice }}"
              echo "**Config Selection:** \`${{ needs.validate-config.outputs.config_choice }}\`"
            fi
            echo
            echo "---"
            echo
            for section in all-artifacts/release-section-*.md; do
              if [ -f "$section" ]; then
                cat "$section"
                echo
                echo "---"
                echo
              fi
            done
            echo "### 🔄 Git ChangeLog:"
            echo "$GIT_CHANGELOG"
          } > release.md

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat release.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Release Step Summary
          {
            echo "# 🚀 Official GitHub Release"
            echo "- **Tag:** [kernel-${{ github.run_number }}](https://github.com/${{ github.repository }}/releases/tag/kernel-${{ github.run_number }})"
            echo "- **Kernel Version:** ${{ needs.validate-config.outputs.kernel_tag }}"
            echo "- **Target(s):** ${{ needs.validate-config.outputs.target_choice }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚀 Upload Unified GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: kernel-${{ github.run_number }}
          name: "Kernel ${{ needs.validate-config.outputs.kernel_tag }} (Build #${{ github.run_number }})"
          body: ${{ steps.release_body.outputs.body }}
          files: |
            all-artifacts/*.deb
            all-artifacts/*.buildinfo
            all-artifacts/*.changes
            all-artifacts/*.log
          overwrite_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-telegram:
    name: 📤 4. Telegram Notification
    needs: [validate-config, build-kernel, release]
    if: always() && needs.validate-config.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download all compiled artifacts & logs
        uses: actions/download-artifact@v8
        with:
          pattern: compiled-kernel-artifacts-*
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: 📤 Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
          BUILD_STATUS: ${{ needs.build-kernel.result }}
          RELEASE_STATUS: ${{ needs.release.result }}
          KERNEL_TAG: ${{ needs.validate-config.outputs.kernel_tag }}
          TARGET_CHOICE: ${{ needs.validate-config.outputs.target_choice }}
          CONFIG_CHOICE: ${{ needs.validate-config.outputs.config_choice }}
          KERNEL_URL: ${{ needs.validate-config.outputs.download_url }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "${TARGET_CHOICE}" = "Both" ]; then
            CONFIG_LINE=""
            TARGET_LINE="🎯 <b>Target(s):</b> Both (AMD Ryzen 9 & Lenovo T440p)"
          else
            CONFIG_LINE="📄 <b>Config:</b> ${CONFIG_CHOICE}"
            TARGET_LINE="🎯 <b>Target(s):</b> ${TARGET_CHOICE}"
          fi

          if [ "$BUILD_STATUS" = "success" ] && [ "$RELEASE_STATUS" = "success" ]; then
            DEB_LIST=$(find artifacts/ -name "*.deb" -exec basename {} \; 2>/dev/null | sort -u | sed 's/^/ • /')
            if [ -z "$DEB_LIST" ]; then
              DEB_LIST=" • Packages generated successfully"
            fi

            MESSAGE=$(printf "%s\n" \
              "<b>🐧 Linux Kernel Build ✅ Success</b>" \
              "" \
              "${TARGET_LINE}" \
              ${CONFIG_LINE:+"${CONFIG_LINE}"} \
              "🏷️ <b>Base Version:</b> ${KERNEL_TAG:-Unknown}" \
              "🚀 <b>Release:</b> <a href=\"https://github.com/${GITHUB_REPOSITORY}/releases/tag/kernel-${RUN_NUMBER}\">kernel-${RUN_NUMBER}</a>" \
              "" \
              "📦 <b>Generated .deb Packages:</b>" \
              "<code>${DEB_LIST}</code>" \
              "" \
              "🏷️ <b>Workflow:</b>" \
              "🔗 <a href=\"${RUN_URL}\">Link to GitHub</a>")

          else
            ERROR_SNIPPET=""
            for err_file in artifacts/build-error-*.log; do
              if [ -f "$err_file" ]; then
                SNIP=$(tail -n 30 "$err_file" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
                ERROR_SNIPPET=$(printf "%b\n<b>[%s]:</b>\n<pre>%s</pre>" "$ERROR_SNIPPET" "$(basename "$err_file")" "$SNIP")
              fi
            done

            if [ -z "$ERROR_SNIPPET" ]; then
              for log_file in artifacts/build-*.log; do
                if [ -f "$log_file" ]; then
                  SNIP=$(tail -n 30 "$log_file" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
                  ERROR_SNIPPET=$(printf "%b\n<b>[%s]:</b>\n<pre>%s</pre>" "$ERROR_SNIPPET" "$(basename "$log_file")" "$SNIP")
                fi
              done
            fi

            if [ -z "$ERROR_SNIPPET" ]; then
              ERROR_SNIPPET="⚠️ <b>No detailed error log found in build artifacts.</b>"
            fi

            SRC_INFO="${KERNEL_TAG}"
            if [ -z "$SRC_INFO" ]; then
              SRC_INFO="${KERNEL_URL}"
            fi

            MESSAGE=$(printf "%s\n" \
              "<b>🐧 Linux Kernel Build ❌ Failed (Build: ${BUILD_STATUS^}, Release: ${RELEASE_STATUS^})</b>" \
              "" \
              "⚠️ <b>Execution Parameters:</b>" \
              "• <b>Target(s):</b> ${TARGET_CHOICE}" \
              ${CONFIG_LINE:+"• ${CONFIG_LINE}"} \
              "• <b>Source:</b> ${SRC_INFO}" \
              "" \
              "📋 <b>Error Diagnostics:</b>" \
              "${ERROR_SNIPPET}" \
              "" \
              "🏷️ <b>Workflow:</b>" \
              "🔗 <a href=\"${RUN_URL}\">View full logs on GitHub Actions</a>")
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHATID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$MESSAGE" \
            >/dev/null 2>&1
