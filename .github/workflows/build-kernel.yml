name: 🐧 Build kernel

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      config:
        description: '📄 Kernel config name (ej: config-6.19.14-debian13 from configs/)'
        required: true
        default: 'config-6.19.14-debian13'
      patch:
        description: '🧩 Optional patch name (from patchs/ in repo)'
        required: false
        default: ''
      localversion:
        description: '📄 Local version name (ej: -custom, -local..)'
        required: true
        default: '-ryzen9'
      tag:
        description: '🏷️ Git tag from torvalds/linux repo (used if no URL)'
        required: false
        default: ''
      url:
        description: '📦 Kernel tarball URL from kernel.org (.tar.gz or .tar.xz)'
        required: false
        default: 'https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.19.14.tar.gz'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_OPTIONS: "--no-deprecation"
  DEFAULT_CONFIG: 'config-6.19.14-debian13'
  DEFAULT_LOCALVERSION: '-ryzen9'
  DEFAULT_URL: 'https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.19.14.tar.gz'
  ARCH_FLAGS: '-march=znver3'
  RAW_BASE_URL: 'https://raw.githubusercontent.com/azagramac/linux-kernel/refs/heads/master'
  KERNEL_CONFIG: ${{ inputs.config || 'config-6.19.14-debian13' }}
  KERNEL_LOCALVERSION: ${{ inputs.localversion || '-ryzen9' }}
  KERNEL_URL: ${{ inputs.url || 'https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.19.14.tar.gz' }}
  KERNEL_PATCH: ${{ inputs.patch }}
  KERNEL_TAG: ${{ inputs.tag }}

jobs:
  prepare:
    name: 🔍 1. Prepare Environment & Source
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: 🛠️ Prepare container base tools
        run: |
          apt-get update -qq
          apt-get install -y git sudo curl tar xz-utils procps

      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: ⚙️ Install build dependencies
        run: |
          sudo apt install -y git build-essential gcc-14 g++-14 fakeroot bc bison flex libdw-dev libelf-dev libssl-dev \
            libncurses-dev dwarves debhelper rsync python3 ccache curl jq patch kmod
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: 📥 Download kernel tarball
        if: ${{ inputs.url != '' || (inputs.tag == '' && github.event_name == 'pull_request') }}
        id: download_tarball
        run: |
          URL="$KERNEL_URL"
          FILENAME=$(basename "$URL")
          EXT="${FILENAME##*.}"
          if [[ "$EXT" != "gz" && "$EXT" != "xz" ]]; then
            echo "❌ Only .tar.gz or .tar.xz are allowed"
            exit 1
          fi
          echo "⬇️ Downloading kernel package..."
          curl -L -o kernel_package.tar."$EXT" "$URL"
          mkdir -p kernel_build
          tar -xf kernel_package.tar."$EXT" -C kernel_build --strip-components=1
          TAG=$(echo "$FILENAME" | sed -E 's/linux-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.(gz|xz)/\1/')
          echo "kernel_tag=$TAG" >> $GITHUB_ENV

      - name: 📥 Clone torvalds/linux repo
        if: ${{ inputs.url == '' && inputs.tag != '' }}
        id: clone_repo
        run: |
          git clone --depth 1 --branch "$KERNEL_TAG" https://github.com/torvalds/linux kernel_build
          echo "kernel_tag=$KERNEL_TAG" >> $GITHUB_ENV

      - name: 🔍 Verify kernel source
        run: |
          if [ ! -d kernel_build ]; then
            echo "❌ No kernel source available! Provide either a valid URL or a tag."
            exit 1
          fi

      - name: 📄 Download .config and optional patch from GitHub
        run: |
          CONFIG_INPUT="$KERNEL_CONFIG"
          PATCH_INPUT="$KERNEL_PATCH"
          
          if [ -f "configs/${CONFIG_INPUT}" ]; then
            echo "📋 Using local config configs/${CONFIG_INPUT}..."
            cp "configs/${CONFIG_INPUT}" kernel_build/.config
          else
            CONFIG_URL="${RAW_BASE_URL}/configs/${CONFIG_INPUT}"
            echo "⬇️ Downloading config from $CONFIG_URL..."
            curl -L -o kernel_build/.config "$CONFIG_URL"
          fi

          if [ -n "$PATCH_INPUT" ]; then
            if [ -f "patchs/${PATCH_INPUT}" ]; then
              echo "📋 Using local patch patchs/${PATCH_INPUT}..."
              cp "patchs/${PATCH_INPUT}" kernel_build/patch_file.patch
            else
              PATCH_URL="${RAW_BASE_URL}/patchs/${PATCH_INPUT}"
              echo "⬇️ Downloading patch from $PATCH_URL..."
              if curl -L -f -o kernel_build/patch_file.patch "$PATCH_URL"; then
                echo "✅ Patch downloaded successfully"
              else
                echo "⚠️ Patch $PATCH_INPUT not found, skipping..."
              fi
            fi
          fi

      - name: 🔧 Apply kernel config
        working-directory: kernel_build
        run: |
          echo "🔧 Applying configuration and running olddefconfig..."
          make olddefconfig

      - name: 🧩 Apply patch
        if: ${{ inputs.patch != '' }}
        working-directory: kernel_build
        run: |
          PATCH_FILE="patch_file.patch"
          if [ -f "$PATCH_FILE" ]; then
            echo "🔧 Applying patch $PATCH_FILE"
            patch -p1 < "$PATCH_FILE" || true
          else
            echo "⚠️ No patch to apply, continuing build"
          fi

      - name: 🔍 Show kernel version
        working-directory: kernel_build
        run: |
          echo "🏷️ Kernel to be built: $(make kernelrelease)"

      - name: 📤 Upload prepared kernel source artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: prepared-kernel-source
          path: kernel_build/
          include-hidden-files: true

  build-and-release:
    name: 🐧 2. Build Kernel & Publish Release
    needs: prepare
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: -v /:/host
    outputs:
      kernel_version: ${{ steps.get_version.outputs.version }}
      release_description: ${{ steps.release_body.outputs.description }}
    steps:
      - name: 🛠️ Prepare container base tools
        run: |
          apt-get update -qq
          apt-get install -y git sudo curl tar xz-utils procps

      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🧹 Clean up host runner space & drop RAM caches
        run: |
          rm -rf /host/usr/share/dotnet /host/usr/local/lib/android /host/opt/ghc /host/opt/hostedtoolcache || true

      - name: ⚙️ Install build dependencies
        run: |
          sudo apt install -y git build-essential gcc-14 g++-14 fakeroot bc bison flex libdw-dev libelf-dev libssl-dev \
            libncurses-dev dwarves debhelper rsync python3 ccache curl jq patch kmod
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: 📥 Download prepared kernel source
        uses: actions/download-artifact@v8
        with:
          name: prepared-kernel-source
          path: kernel_build

      - name: 🐧 Build kernel
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: kernel_build
        shell: bash
        run: |
          set -o pipefail

          export DEB_BUILD_OPTIONS="parallel=$(nproc)"

          chmod -R +x scripts/
          find . -type f \( -name "*.sh" -o -name "*.pl" -o -name "*.py" \) -exec chmod +x {} +

          KERNEL_VER=$(make kernelversion)
          LOCAL_VER="$KERNEL_LOCALVERSION"

          echo "========================================="
          echo "🐧 Environment Build"
          echo "========================================="
          echo "Kernel version : $KERNEL_VER"
          echo "Local version  : $LOCAL_VER"
          echo "Architecture   : $ARCH_FLAGS"
          echo "Build jobs     : $(nproc)"
          echo "GCC            : $(gcc --version | head -n1)"
          echo "G++            : $(g++ --version | head -n1)"
          echo "Pahole         : $(pahole --version 2>&1 || echo 'Not found')"
          echo "Make           : $(make --version | head -n1)"
          echo "========================================="

          BUILD_LOG="../build.log"
          ERROR_LOG="../build-error.log"

          rm -f "$BUILD_LOG" "$ERROR_LOG"

          echo "🚀 Starting kernel compilation..."

          if make -j$(nproc) bindeb-pkg \
              KCFLAGS="$ARCH_FLAGS" \
              LOCALVERSION="$LOCAL_VER" \
              KDEB_PKGVERSION="$KERNEL_VER$LOCAL_VER" 2>&1 | tee "$BUILD_LOG"
          then
              echo "========================================="
              echo "✅ Kernel compilation completed successfully"
              echo "========================================="
          else
              BUILD_EXIT=${PIPESTATUS[0]}

              echo "========================================="
              echo "❌ Kernel compilation FAILED"
              echo "Exit code: $BUILD_EXIT"
              echo "========================================="

              {
                echo "========================================="
                echo "POSSIBLE ROOT CAUSES"
                echo "========================================="

                grep -nEi \
                  '(^|[[:space:]])(error|fatal):|undefined reference|cannot find|No such file|Killed|out of memory|oom|pahole|BTF|DWARF|segmentation fault|internal compiler error' \
                  "$BUILD_LOG" || true

                echo
                echo "========================================="
                echo "LAST 150 LINES"
                echo "========================================="

                tail -n 150 "$BUILD_LOG"
              } > "$ERROR_LOG"

              echo
              cat "$ERROR_LOG"

              exit "$BUILD_EXIT"
          fi

      - name: 🆔 Get compiled kernel version
        if: ${{ github.event_name != 'pull_request' }}
        id: get_version
        working-directory: kernel_build
        run: |
          echo "version=$(make kernelrelease)" >> $GITHUB_OUTPUT

      - name: 📦 Move .deb & log artifacts
        if: ${{ github.event_name != 'pull_request' && always() }}
        run: |
          mkdir -p artifacts

          echo "📦 Collecting build artifacts..."

          find . -name "*.deb" -exec cp {} artifacts/ \; || true
          find . -name "*.changes" -exec cp {} artifacts/ \; || true
          find . -name "*.buildinfo" -exec cp {} artifacts/ \; || true

          if [ -f build.log ]; then
            cp build.log artifacts/build.log
            echo "✅ build.log saved"
          fi

          if [ -f build-error.log ]; then
            cp build-error.log artifacts/build-error.log
            echo "❌ build-error.log saved"
          fi

          echo
          echo "========================================="
          echo "📁 Collected artifacts"
          echo "========================================="
          ls -lh artifacts/

      - name: 📤 Upload compiled kernel artifacts
        if: ${{ github.event_name != 'pull_request' && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: compiled-kernel-artifacts
          path: artifacts/

      - name: 📋 Generate formatted release body from .changes
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: release_body
        shell: bash
        run: |
          CHANGES_FILE=$(find . -name "*.changes" | head -n1)
      
          if [ -z "$CHANGES_FILE" ]; then
            echo "❌ No .changes file found in workspace or artifacts directory"
            echo "📁 Content of root directory:"
            ls -la
            echo "📁 Content of artifacts directory:"
            ls -la artifacts/ || true
            exit 1
          fi
      
          get_field() {
            awk -F': ' -v key="$1" '$1==key {print $2}' "$CHANGES_FILE"
          }
      
          FORMAT=$(get_field "Format")
          DATE=$(get_field "Date")
          SOURCE=$(get_field "Source")
          ARCH=$(get_field "Architecture")
          VERSION=$(get_field "Version")
          DIST=$(get_field "Distribution")
          URGENCY=$(get_field "Urgency")
          MAINTAINER=$(get_field "Maintainer")
          CHANGED_BY=$(get_field "Changed-By")
      
          BINARIES=$(get_field "Binary" | sed 's/ /\` \`/g; s/^/\`/; s/$/\`/')
      
          DESCRIPTION=$(awk '
            /^Description:/ {flag=1; next}
            /^Changes:/ {flag=0}
            flag && NF {print " - "$0}
          ' "$CHANGES_FILE")
      
          SHA1=$(awk '
            /^Checksums-Sha1:/ {flag=1; next}
            /^Checksums-Sha256:/ {flag=0}
            flag && NF {print}
          ' "$CHANGES_FILE")
      
          SHA256=$(awk '
            /^Checksums-Sha256:/ {flag=1; next}
            /^Files:/ {flag=0}
            flag && NF {print}
          ' "$CHANGES_FILE")
      
          FILES=$(awk '
            /^Files:/ {flag=1; next}
            flag && NF {print}
          ' "$CHANGES_FILE")
      
          GIT_CHANGELOG=$(git log -n 10 --pretty=format:"* %h - %s (%an, %cr)" 2>/dev/null || echo " * Custom built Linux kernel.")
      
          cat <<EOF > release.md
          **Format:** $FORMAT  
          **Date:** $DATE  
          **Source:** $SOURCE  
          **Binary:** $BINARIES  
          **Architecture:** $ARCH  
          **Version:** $VERSION  
          **Distribution:** $DIST  
          **Urgency:** $URGENCY  
          **Maintainer:** $MAINTAINER  
          **Changed-By:** $CHANGED_BY  

          ## 📝 Description:
          $DESCRIPTION

          ## 🔄 ChangeLog:
          $GIT_CHANGELOG

          ## ✅ Checksums-Sha1:
          \`\`\`bash
          $SHA1
          \`\`\`

          ## ✅ Checksums-Sha256:
          \`\`\`bash
          $SHA256
          \`\`\`

          ## 📦 Files:
          \`\`\`bash
          $FILES
          \`\`\`
          EOF
      
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat release.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🚀 Upload Linux Kernel
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: kernel-${{ github.run_number }}
          name: "Kernel ${{ steps.get_version.outputs.version }}"
          body: ${{ steps.release_body.outputs.body }}
          files: |
            artifacts/*.deb
            artifacts/*.buildinfo
          overwrite_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-telegram:
    name: 📤 3. Telegram Notification
    needs: [prepare, build-and-release]
    if: ${{ github.event_name != 'pull_request' && always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Compiled Artifacts
        uses: actions/download-artifact@v8
        with:
          name: compiled-kernel-artifacts
          path: artifacts/
        continue-on-error: true

      - name: 📤 Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
          BUILD_STATUS: ${{ needs.build-and-release.result }}
          KERNEL_VERSION: ${{ needs.build-and-release.outputs.kernel_version }}
          PKG_DESCRIPTION: ${{ needs.build-and-release.outputs.release_description }}
          KERNEL_CONFIG: ${{ env.KERNEL_CONFIG }}
          KERNEL_URL: ${{ env.KERNEL_URL }}
          KERNEL_TAG: ${{ env.KERNEL_TAG }}
          KERNEL_LOCALVERSION: ${{ env.KERNEL_LOCALVERSION }}
          KERNEL_PATCH: ${{ env.KERNEL_PATCH }}
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$BUILD_STATUS" = "success" ]; then
            CLEAN_DESC=$(echo "$PKG_DESCRIPTION" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

            if [ -z "$CLEAN_DESC" ]; then
              CLEAN_DESC=" - No disponible"
            fi

            MESSAGE="<b>🐧 Linux Kernel Build ✅ Success</b>

            🏷️ <b>Versión:</b> ${KERNEL_VERSION:-Desconocida}

            📦 <b>Ficheros:</b>
            ${CLEAN_DESC}

            🏷️ <b>Workflow:</b>
            🔗 <a href=\"${RUN_URL}\">Ver detalles en GitHub</a>"

          else
            ERROR_LOG=""

            if [ -f artifacts/build-error.log ]; then
              ERROR_SNIPPET=$(tail -n 40 artifacts/build-error.log | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

              ERROR_LOG="
              📋 <b>Diagnóstico del error:</b>
              <pre>${ERROR_SNIPPET}</pre>"

            elif [ -f artifacts/build.log ]; then
              ERROR_SNIPPET=$(tail -n 40 artifacts/build.log | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

              ERROR_LOG="
              📋 <b>Últimas líneas del build.log:</b>
              <pre>${ERROR_SNIPPET}</pre>"

            else
              ERROR_LOG="
              ⚠️ <b>No se encontró ningún log de compilación.</b>"
            fi

            SRC_INFO="${KERNEL_TAG}"

            if [ -z "$SRC_INFO" ]; then
              SRC_INFO="${KERNEL_URL}"
            fi

            if [ -z "$SRC_INFO" ]; then
              SRC_INFO="No especificado"
            fi

            MESSAGE="<b>🐧 Linux Kernel Build ❌ Fallido (${BUILD_STATUS^})</b>

            ⚠️ <b>Parámetros de la ejecución:</b>
            • <b>Config:</b> ${KERNEL_CONFIG:-N/A}
            • <b>Origen:</b> ${SRC_INFO}
            • <b>Localversion:</b> ${KERNEL_LOCALVERSION:-Ninguna}
            • <b>Parche:</b> ${KERNEL_PATCH:-Ninguno}
            ${ERROR_LOG}

            🏷️ <b>Workflow:</b>
            🔗 <a href=\"${RUN_URL}\">Ver logs completos en GitHub Actions</a>"
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHATID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$MESSAGE" \
            >/dev/null 2>&1
